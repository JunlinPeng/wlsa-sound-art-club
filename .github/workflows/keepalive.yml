name: Supabase keepalive

# Supabase's free tier pauses projects after ~7 days without API activity.
# One tiny REST call per week keeps the sound map awake. Requires two repo
# secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL        e.g. https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY   the publishable anon key (public by design)

on:
  schedule:
    # Every 2 days, 07:17 UTC — comfortably inside the ~7-day free-tier pause
    # window even if one run is delayed or skipped.
    - cron: "17 7 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set — see keepalive.yml header"
            exit 1
          fi
          curl -sf --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/sounds?select=id&limit=1" \
            -o /dev/null
          echo "OK: Supabase responded — project stays awake."
